plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mlcentral.ventas'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mlcentral.ventas'
        minSdk 26
        targetSdk 33
        versionCode 6
        versionName '1.5'
    }

    signingConfigs {
        stable {
            def signingFile = System.getenv('MLC_SIGNING_FILE')
            def signingPassword = System.getenv('MLC_SIGNING_PASSWORD')
            if (signingFile != null && !signingFile.isEmpty()) {
                storeFile file(signingFile)
                storePassword signingPassword
                keyAlias 'mlcentral'
                keyPassword signingPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
    }
}
