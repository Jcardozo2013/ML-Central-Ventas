name: Compilar APK ML Central Ventas

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Leer versión declarada
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          APP_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)"
          if [ -z "$APP_VERSION" ] || [ -z "$APP_CODE" ]; then
            echo "ERROR: no se pudo leer versionName/versionCode de app/build.gradle"
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APP_CODE=$APP_CODE" >> "$GITHUB_ENV"
          echo "Compilando versión $APP_VERSION (code $APP_CODE)"

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Recuperar firma Android estable
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mlcentral-ventas-stable-signing-v1

      - name: Asegurar firma Android y verificar huella de clave
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 12000 \
              -dname "CN=ML Central Ventas, OU=Android, O=ML Central, C=UY"
          fi
          CERT_SHA="$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -rfc \
            | openssl x509 -noout -fingerprint -sha256 \
            | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="$(tr -d '\r\n :\t' < signing_expected_sha256.txt | tr '[:lower:]' '[:upper:]')"
          if [ "$CERT_SHA" != "$EXPECTED" ]; then
            echo "ERROR: la clave recuperada no coincide con la firma fija esperada."
            echo "Esperada: $EXPECTED"
            echo "Recuperada: $CERT_SHA"
            exit 1
          fi
          printf '%s\n' "$CERT_SHA" > signing_keystore_sha256.txt
          echo "Clave estable SHA256: $CERT_SHA"

      - name: Recuperar canal privado existente
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TOPIC=""
          PINNED_ARTIFACT_ID="9993951669"
          if curl -fsSL -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PINNED_ARTIFACT_ID}/zip" \
            -o previous-topic.zip; then
            TOPIC="$(unzip -p previous-topic.zip mlcentral_topic.txt 2>/dev/null | tr -d '\r\n' || true)"
          fi
          if [ -z "$TOPIC" ]; then
            ARTIFACT_ID="$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=ML-Central-Ventas-APK&per_page=100" \
              | python3 -c 'import json,sys; a=[x for x in json.load(sys.stdin).get("artifacts",[]) if not x.get("expired")]; print(a[0]["id"] if a else "")')"
            if [ -n "$ARTIFACT_ID" ] && curl -fsSL -L \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              -o previous-topic.zip; then
              TOPIC="$(unzip -p previous-topic.zip mlcentral_topic.txt 2>/dev/null | tr -d '\r\n' || true)"
            fi
          fi
          if [ -z "$TOPIC" ]; then
            echo "ERROR: no se pudo recuperar el canal privado existente."
            exit 1
          fi
          printf '%s\n' "$TOPIC" > mlcentral_topic.txt
          sed -i "s/__MLC_TOPIC__/$TOPIC/g" app/src/main/java/com/mlcentral/ventas/AppConfig.java

      - name: Crear sonido predeterminado de venta
        shell: bash
        run: |
          mkdir -p app/src/main/res/raw
          python3 - <<'PY2'
          import wave, math, struct
          rate = 44100
          duration = 0.65
          with wave.open("app/src/main/res/raw/sale_chime.wav", "w") as f:
              f.setnchannels(1); f.setsampwidth(2); f.setframerate(rate)
              data = []
              for i in range(int(rate * duration)):
                  t = i / rate
                  freq = 880 if t < 0.22 else 1320
                  envelope = max(0.0, 1.0 - t / duration)
                  data.append(struct.pack("<h", int(15000 * math.sin(2 * math.pi * freq * t) * envelope)))
              f.writeframes(b"".join(data))
          PY2

      - name: Compilar APK prueba 1
        run: gradle clean assembleDebug --stacktrace

      - name: Verificar versión y firma APK prueba 1
        shell: bash
        run: |
          set -euo pipefail
          APK1="ML-Central-Ventas-v${APP_VERSION}-build1.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK1"
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          BADGING="$($AAPT dump badging "$APK1" | head -1)"
          ACTUAL_VERSION="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          ACTUAL_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          echo "APK 1 declara versionName=$ACTUAL_VERSION versionCode=$ACTUAL_CODE"
          if [ "$ACTUAL_VERSION" != "$APP_VERSION" ] || [ "$ACTUAL_CODE" != "$APP_CODE" ]; then
            echo "ERROR: la versión interna del APK 1 no coincide con app/build.gradle"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK1" 2>&1 | tee apksigner-build1.txt
          APK_SHA_1="$(grep -i 'certificate SHA-256 digest' apksigner-build1.txt | head -1 | awk -F': ' '{print $NF}' | tr -d ':\r\n ' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="$(tr -d '\r\n :\t' < signing_expected_sha256.txt | tr '[:lower:]' '[:upper:]')"
          if [ -z "$APK_SHA_1" ] || [ "$APK_SHA_1" != "$EXPECTED" ]; then
            echo "ERROR: el APK 1 no usa la firma estable esperada."
            exit 1
          fi
          printf '%s\n' "$APK_SHA_1" > signing_apk_build1_sha256.txt

      - name: Compilar APK prueba 2
        run: gradle clean assembleDebug --stacktrace

      - name: Verificar versión y firma APK final
        shell: bash
        run: |
          set -euo pipefail
          FINAL="ML-Central-Ventas-v${APP_VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$FINAL"
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          BADGING="$($AAPT dump badging "$FINAL" | head -1)"
          ACTUAL_VERSION="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          ACTUAL_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          echo "APK FINAL declara versionName=$ACTUAL_VERSION versionCode=$ACTUAL_CODE"
          if [ "$ACTUAL_VERSION" != "$APP_VERSION" ] || [ "$ACTUAL_CODE" != "$APP_CODE" ]; then
            echo "ERROR: la versión interna del APK FINAL no coincide con app/build.gradle"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$FINAL" 2>&1 | tee apksigner-build2.txt
          APK_SHA_2="$(grep -i 'certificate SHA-256 digest' apksigner-build2.txt | head -1 | awk -F': ' '{print $NF}' | tr -d ':\r\n ' | tr '[:lower:]' '[:upper:]')"
          APK_SHA_1="$(cat signing_apk_build1_sha256.txt | tr -d '\r\n :\t' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="$(tr -d '\r\n :\t' < signing_expected_sha256.txt | tr '[:lower:]' '[:upper:]')"
          if [ -z "$APK_SHA_2" ] || [ "$APK_SHA_2" != "$EXPECTED" ] || [ "$APK_SHA_2" != "$APK_SHA_1" ]; then
            echo "ERROR: las dos compilaciones no tienen exactamente la firma esperada."
            exit 1
          fi
          printf '%s\n' "$APK_SHA_2" > signing_apk_final_sha256.txt
          printf '%s\n' "$ACTUAL_VERSION" > apk_version_verified.txt
          printf '%s\n' "$ACTUAL_CODE" > apk_version_code_verified.txt
          echo "APK v$ACTUAL_VERSION (code $ACTUAL_CODE) verificado y firmado correctamente."

      - name: Guardar APK y configuración
        uses: actions/upload-artifact@v4
        with:
          name: ML-Central-Ventas-APK
          path: |
            ML-Central-Ventas-v${{ env.APP_VERSION }}.apk
            mlcentral_topic.txt
            signing_keystore_sha256.txt
            signing_apk_build1_sha256.txt
            signing_apk_final_sha256.txt
            apk_version_verified.txt
            apk_version_code_verified.txt
          retention-days: 90
