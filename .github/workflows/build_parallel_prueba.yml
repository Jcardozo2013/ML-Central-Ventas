name: Candidata optimizada - firma comprobada por USB
on:
  pull_request:
    branches: [prueba-paralela-v182]
permissions:
  contents: read
  actions: read
jobs:
  compile_only:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'auditoria/optimizada-v1.85-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recuperar firma exclusiva de esta prueba
        id: signing
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: mlcentral-paralela-v182-signing-v1
          fail-on-cache-miss: true
      - name: Comprobar existencia de firma original de esta app paralela
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            echo "ERROR: falta la clave de la app paralela. No generar otra firma."
            exit 1
          fi
      - name: Verificar certificado antes de compilar
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.signing.outputs.cache-hit }}" = "true"
          keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/mlcentral-cert.der"
          ACTUAL="$(sha256sum "$RUNNER_TEMP/mlcentral-cert.der" | cut -d ' ' -f 1)"
          test "$ACTUAL" = "b623886a56358e91577f759afa8d86d5c6387fa9c4213679585542eb3eaa4cff" || { echo "Firma distinta de la instalada; detener."; exit 1; }
      - name: Recuperar canal privado existente
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TOPIC=""
          PINNED_ARTIFACT_ID="11714319001"
          if curl -fsSL -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PINNED_ARTIFACT_ID}/zip" \
            -o previous-topic.zip; then
            TOPIC="$(unzip -p previous-topic.zip mlcentral_topic.txt 2>/dev/null | tr -d '\r\n' || true)"
          fi
          if [ -z "$TOPIC" ]; then
            ARTIFACT_ID="$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=ML-Central-Ventas-APK&per_page=100" \
              | python3 -c 'import json,sys; a=[x for x in json.load(sys.stdin).get("artifacts",[]) if not x.get("expired")]; print(a[0]["id"] if a else "")')"
            if [ -n "$ARTIFACT_ID" ] && curl -fsSL -L \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              -o previous-topic.zip; then
              TOPIC="$(unzip -p previous-topic.zip mlcentral_topic.txt 2>/dev/null | tr -d '\r\n' || true)"
            fi
          fi
          if [ -z "$TOPIC" ]; then
            echo "ERROR: no se pudo recuperar el canal privado existente."
            exit 1
          fi
          printf '%s\n' "$TOPIC" > mlcentral_topic.txt
          sed -i "s/__MLC_TOPIC__/$TOPIC/g" app/src/main/java/com/mlcentral/ventas/AppConfig.java

      - name: Generar sonido de venta necesario para compilar
        shell: bash
        run: |
          mkdir -p app/src/main/res/raw
          python3 - <<'PY2'
          import wave, math, struct
          rate = 44100
          duration = 0.65
          with wave.open("app/src/main/res/raw/sale_chime.wav", "w") as f:
              f.setnchannels(1); f.setsampwidth(2); f.setframerate(rate)
              data = []
              for i in range(int(rate * duration)):
                  t = i / rate
                  freq = 880 if t < 0.22 else 1320
                  envelope = max(0.0, 1.0 - t / duration)
                  data.append(struct.pack("<h", int(15000 * math.sin(2 * math.pi * freq * t) * envelope)))
              f.writeframes(b"".join(data))
          PY2
      - name: Pruebas de paginación y límites de solicitudes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mlcentral-tests"
          javac -d "$RUNNER_TEMP/mlcentral-tests" app/src/main/java/com/mlcentral/ventas/FirebaseReadQuery.java app/src/main/java/com/mlcentral/ventas/SnapshotRequestPolicy.java audit/FirebaseReadQueryTest.java
          java -cp "$RUNNER_TEMP/mlcentral-tests" com.mlcentral.ventas.FirebaseReadQueryTest
      - name: Compilar ML Central Ventas
        run: gradle clean assembleDebug --stacktrace
      - name: Verificar identidad, versión y firma previas
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          BADGING="$("$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging "$APK")"
          echo "$BADGING"
          echo "$BADGING" | grep -q "package: name='com.mlcentral.ventas.prueba'"
          echo "$BADGING" | grep -q "versionCode='86'"
          echo "$BADGING" | grep -q "versionName='1.85'"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs "$APK" > firma_prueba.txt
          grep -qi "b623886a56358e91577f759afa8d86d5c6387fa9c4213679585542eb3eaa4cff" firma_prueba.txt || { echo "Firma distinta: no publicar"; exit 1; }
          sha256sum "$APK" > APK_SHA256.txt
          cp "$APK" ML-Central-Ventas-v1.85-OPTIMIZADA-CANDIDATA.apk
          printf '%s\n' \
            "Candidata optimizada v1.85, paquete y certificado verificados contra el celular." \
            "No instalada. Pendientes pruebas funcionales reales y medición productiva." \
            "No contiene ni exporta la clave privada de firma." > IMPORTANTE_LEER.txt
      - name: Guardar APK actualizada
        uses: actions/upload-artifact@v4
        with:
          name: ML-Central-OPTIMIZADA-CANDIDATA
          retention-days: 30
          path: |
            ML-Central-Ventas-v1.85-OPTIMIZADA-CANDIDATA.apk
            firma_prueba.txt
            APK_SHA256.txt
            IMPORTANTE_LEER.txt
      - name: Quitar firma del ejecutor al terminar
        if: always()
        shell: bash
        run: rm -f "$HOME/.android/debug.keystore"
